---
layout: default
---

<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    <span>·</span>
    <span>{{ site.name }}</span>
  </p>
  <div class="post-body">
    {{ content }}
  </div>
</article>

<p class="back-link"><a href="{{ '/' | relative_url }}">← 返回首页</a></p>
