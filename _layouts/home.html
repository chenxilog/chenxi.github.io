---
layout: default
---

<div class="post-list">
{%- for post in site.posts %}
  <article class="post-card">
    <h2 class="post-card-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p class="post-card-excerpt">{{ post.excerpt | strip_html | strip_newlines | truncate: 130 }}</p>
    <p class="post-card-meta">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
      <span>·</span>
      <span>{{ post.content | strip_html | size | divided_by: 400 | plus: 1 }} 分钟阅读</span>
    </p>
  </article>
{%- endfor %}
</div>
